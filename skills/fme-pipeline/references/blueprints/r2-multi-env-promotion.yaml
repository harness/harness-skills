# R2: Multi-Environment Promotion (THE HEADLINE)
#
# Full pipeline blueprint for the fme-pipeline skill.
# See ../blueprints.md and ../scenarios.md for context.
#
# STARTER / RESUME PATH: This blueprint is designed for flags that start KILLED
# in each environment. The verify-before-restore checkpoint in every env block
# enforces human readback of the live flag state before FmeFlagRestore re-activates
# it, including all prod regions. If a flag is already active and you are authoring
# an explicitly approved live targeting change, omit FmeFlagRestore and the
# verify-before-restore checkpoint for that env; do not auto-kill or add unrequested
# gates.
#
# ORDERING NOTE: in each environment block, the first FmeFlagDefaultAllocation
# is written BEFORE FmeFlagRestore, so a killed env never briefly resumes a
# stale pre-kill allocation before flipping to the approved one.

pipeline:
  identifier: multi_env_promotion
  name: Multi-Environment Flag Promotion
  orgIdentifier: default
  projectIdentifier: my_project
  tags: {}
  variables:
    - name: flagName
      type: String
      description: "Feature flag name"
      value: <+input>
    - name: onTreatment
      type: String
      value: "on"
    - name: offTreatment
      type: String
      value: "off"
  stages:
    - stage:
        identifier: create_jira_ticket
        name: Create Rollout Ticket
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  identifier: jira_create
                  name: Create Jira Ticket
                  type: JiraCreate
                  spec:
                    connectorRef: jira_connector
                    projectKey: PROJ
                    issueType: Task
                    fields:
                      - name: Summary
                        value: "Feature Flag Rollout: <+pipeline.variables.flagName>"
                      - name: Description
                        value: "Rolling out flag <+pipeline.variables.flagName> across dev/qa/staging/prod"
              - step:
                  identifier: jira_in_progress
                  name: Transition to In Progress
                  type: JiraUpdate
                  spec:
                    connectorRef: jira_connector
                    issueKey: <+pipeline.stages.create_jira_ticket.spec.execution.steps.jira_create.issue.key>
                    transitionTo:
                      transitionName: In Progress
                      status: In Progress
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: MarkAsFailure
    - stage:
        identifier: dev_environment
        name: Dev - 100 Percent
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  identifier: dev_100
                  name: Set Dev to 100 Percent
                  type: FmeFlagDefaultAllocation
                  spec:
                    flagName: <+pipeline.variables.flagName>
                    environment: dev
                    allocation:
                      - treatment: <+pipeline.variables.onTreatment>
                        amount: 100
                      - treatment: <+pipeline.variables.offTreatment>
                        amount: 0
              - step:
                  identifier: verify_before_restore_dev
                  name: Verify State Before Restore - Dev
                  type: HarnessApproval
                  spec:
                    approvalMessage: >-
                      HUMAN READBACK REQUIRED — do not approve without completing
                      all checks below.

                      1. Open this flag in the Harness UI or run /explain-flag
                      for environment: dev. Confirm isKilled = true, with the
                      approved defaultTreatment and its configuration. Check the
                      trafficAllocation exposure limit separately from treatment allocation.

                      2. Verify the full targeting state matches the approved
                      audience exactly: defaultRule treatment allocation (100% on /
                      0% off), every individual target key per treatment, every
                      segment membership per treatment, all rule conditions,
                      treatment assignments, and treatment configs.

                      3. Re-check any active experiments referencing this flag
                      and confirm no conflict with the intended restore state.

                      4. Approve ONLY if every check above passes exactly.
                      Reject if anything does not match — do not silently proceed.

                      This approval is NOT automated SDK verification. A human
                      must confirm the live flag state before restore proceeds.
                    includePipelineExecutionHistory: true
                    approvers:
                      userGroups:
                        - account.Engineering_Managers
                      minimumCount: 1
                      disallowPipelineExecutor: true
              - step:
                  identifier: restore_dev
                  name: Restore Flag in Dev
                  type: FmeFlagRestore
                  spec:
                    flagName: <+pipeline.variables.flagName>
                    environment: dev
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: MarkAsFailure
    - stage:
        identifier: qa_environment
        name: QA - 50 Then 100 Percent
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  identifier: qa_50
                  name: Set QA to 50 Percent
                  type: FmeFlagDefaultAllocation
                  spec:
                    flagName: <+pipeline.variables.flagName>
                    environment: qa
