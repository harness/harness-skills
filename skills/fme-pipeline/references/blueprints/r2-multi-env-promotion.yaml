                          /explain-flag for environment: prod_eu. Confirm
                          isKilled = true, with the approved defaultTreatment
                          and configuration. Check the trafficAllocation
                          exposure limit separately from treatment allocation.

                          2. Verify the full targeting state matches the
                          approved audience exactly: defaultRule
                          treatment allocation (1% on / 99% off), every
                          individual target key per treatment, every segment
                          membership per treatment, all rule conditions,
                          treatment assignments, and treatment configs.

                          3. Re-check any active experiments referencing
                          this flag and confirm no conflict with the
                          intended restore state.

                          4. Approve ONLY if every check above passes
                          exactly. Reject if anything does not match — do
                          not silently proceed.

                          This approval is NOT automated SDK verification.
                          A human must confirm the live flag state before
                          restore proceeds.
                        includePipelineExecutionHistory: true
                        approvers:
                          userGroups:
                            - account.Engineering_Managers
                          minimumCount: 1
                          disallowPipelineExecutor: true
                  - step:
                      identifier: restore_prod_eu
