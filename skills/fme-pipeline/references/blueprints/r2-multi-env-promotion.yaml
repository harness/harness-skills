                        - account.Engineering_Managers
                      minimumCount: 1
                      disallowPipelineExecutor: true
              - step:
                  identifier: restore_staging
                  name: Restore Flag in Staging
                  type: FmeFlagRestore
                  spec:
                    flagName: <+pipeline.variables.flagName>
                    environment: staging
              - step:
                  identifier: wait_after_staging
                  name: Soak 1 Hour
                  type: Wait
                  spec:
                    duration: 1h
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: MarkAsFailure
    - parallel:
        - stage:
            identifier: prod_us
            name: Prod US - Progressive Ramp
            type: Custom
            spec:
              execution:
                steps:
