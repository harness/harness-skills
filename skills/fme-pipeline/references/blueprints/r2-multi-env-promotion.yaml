                          minimumCount: 1
                          disallowPipelineExecutor: true
                  - step:
                      identifier: restore_prod_us
                      name: Restore Flag in Prod US
                      type: FmeFlagRestore
                      spec:
                        flagName: <+pipeline.variables.flagName>
                        environment: prod_us
                  - step:
                      identifier: wait_us_1
                      name: Soak 2 Hours
                      type: Wait
                      spec:
                        duration: 2h
                  - step:
                      identifier: prod_us_5
                      name: Set Prod US to 5 Percent
                      type: FmeFlagDefaultAllocation
                      spec:
                        flagName: <+pipeline.variables.flagName>
                        environment: prod_us
                        allocation:
                          - treatment: <+pipeline.variables.onTreatment>
                            amount: 5
                          - treatment: <+pipeline.variables.offTreatment>
                            amount: 95
                  - step:
                      identifier: wait_us_5
                      name: Soak 2 Hours
                      type: Wait
                      spec:
