                      1. Open this flag in the Harness UI or run /explain-flag
                      for environment: qa. Confirm isKilled = true, with the
                      approved defaultTreatment and its configuration. Check the
                      trafficAllocation exposure limit separately from treatment allocation.

                      2. Verify the full targeting state matches the approved
                      audience exactly: defaultRule treatment allocation (50% on /
                      50% off), every individual target key per treatment, every
                      segment membership per treatment, all rule conditions,
                      treatment assignments, and treatment configs.

                      3. Re-check any active experiments referencing this flag
                      and confirm no conflict with the intended restore state.

                      4. Approve ONLY if every check above passes exactly.
                      Reject if anything does not match — do not silently proceed.

                      This approval is NOT automated SDK verification. A human
                      must confirm the live flag state before restore proceeds.
                    includePipelineExecutionHistory: true
                    approvers:
                      userGroups:
                        - account.Engineering_Managers
                      minimumCount: 1
                      disallowPipelineExecutor: true
              - step:
                  identifier: restore_qa
                  name: Restore Flag in QA
                  type: FmeFlagRestore
                  spec:
                    flagName: <+pipeline.variables.flagName>
                    environment: qa
              - step:
                  identifier: wait_qa
                  name: Soak 30 Minutes
                  type: Wait
                  spec:
                    duration: 30m
              - step:
                  identifier: qa_100
                  name: Set QA to 100 Percent
                  type: FmeFlagDefaultAllocation
                  spec:
                    flagName: <+pipeline.variables.flagName>
                    environment: qa
                    allocation:
                      - treatment: <+pipeline.variables.onTreatment>
                        amount: 100
                      - treatment: <+pipeline.variables.offTreatment>
                        amount: 0
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: MarkAsFailure
    - stage:
