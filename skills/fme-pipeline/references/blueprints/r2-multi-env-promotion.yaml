                  - step:
                      identifier: prod_us_25
                      name: Set Prod US to 25 Percent
                      type: FmeFlagDefaultAllocation
                      spec:
                        flagName: <+pipeline.variables.flagName>
                        environment: prod_us
                        allocation:
                          - treatment: <+pipeline.variables.onTreatment>
                            amount: 25
                          - treatment: <+pipeline.variables.offTreatment>
                            amount: 75
                  - step:
                      identifier: wait_us_25
                      name: Soak 2 Hours
                      type: Wait
                      spec:
                        duration: 2h
                  - step:
                      identifier: prod_us_50
                      name: Set Prod US to 50 Percent
                      type: FmeFlagDefaultAllocation
                      spec:
                        flagName: <+pipeline.variables.flagName>
                        environment: prod_us
                        allocation:
                          - treatment: <+pipeline.variables.onTreatment>
                            amount: 50
                          - treatment: <+pipeline.variables.offTreatment>
                            amount: 50
                  - step:
                      identifier: wait_us_50
                      name: Soak 2 Hours
                      type: Wait
                      spec:
                        duration: 2h
                  - step:
                      identifier: prod_us_100
                      name: Set Prod US to 100 Percent
                      type: FmeFlagDefaultAllocation
                      spec:
                        flagName: <+pipeline.variables.flagName>
                        environment: prod_us
                        allocation:
                          - treatment: <+pipeline.variables.onTreatment>
                            amount: 100
                          - treatment: <+pipeline.variables.offTreatment>
                            amount: 0
            failureStrategies:
              - onFailure:
                  errors:
                    - AllErrors
                  action:
                    type: MarkAsFailure
